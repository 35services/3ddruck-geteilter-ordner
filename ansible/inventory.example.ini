# Example inventory. Copy it to inventory.ini (ignored by git) and fill in your
# machines; copy host_vars.example/ to host_vars/ for the hub's paths and addresses.

# The machine that runs the hub in Docker, see "Moving the hub" in README.md
[hub]
# the Menti's Mac
localhost ansible_connection=local

# a machine prepared as the next hub, not running yet
[hub_next]
# raspberry-pi.example.ts.net

[clients:children]
computers
sticks
macs

# Machines by their Tailscale names, which stay the same when IP addresses change
# and also work outside the local network

[computers]
# Ubuntu 25.10 and newer use sudo-rs, whose password prompt Ansible doesn't recognize
# ubuntu-pc.example.ts.net ansible_become_exe=sudo.ws

# computers running a 3D-Druck-AG stick (jugendhackt-iso)
[sticks]
# stick-1.example.ts.net

# Macs. geteilter_ordner_client_name is their name at the hub. Ansible needs
# Python 3.9 or newer, see README.md for older macOS
[macs]
# 192.168.1.20 geteilter_ordner_client_name=macbook ansible_python_interpreter=/Users/druck/.local/python-3.12/bin/python3

[clients:vars]
ansible_user=druck

[sticks:vars]
# the Debian Live default password of the sticks
ansible_become_password=live
